apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  namespace: turknet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: turknet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # The privileged `set-vm-max-map-count` initContainer that used to live
      # here was removed on 2026-08-10. It ran with full host privileges from an
      # untagged (= mutable) public busybox image, which made it a direct route
      # to root on the node -- and this node's disk holds the Vaultwarden
      # database. It was also never needed: Ubuntu 24.04 already ships
      # vm.max_map_count=1048576 via /etc/sysctl.d/10-map-count.conf, four times
      # what Elasticsearch asks for. Verify with `sysctl vm.max_map_count`
      # before deploying to a different host.
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          ports:
            - containerPort: 9200
            - containerPort: 9300
          env:
            - name: discovery.type
              value: "single-node"
            # Security is ENABLED on the live cluster. This file said "false"
            # until 2026-08-10, so applying it would have silently switched
            # Elasticsearch authentication off and made the credentials handed
            # to Fluent Bit and the messaging services meaningless.
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: cluster.name
              value: "turknet-messaging-cluster"
            - name: node.name
              value: "es-node-1"
            - name: bootstrap.memory_lock
              value: "true"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              memory: "1Gi"
              cpu: "300m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: turknet
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
  type: ClusterIP
